services:
  app:
    build: .
    platform: linux/amd64
    # The optional settings in `.env` (see `.env.example`) reach the app too.
    env_file:
      - path: .env
        required: false
    environment:
      # Blank URL: Comfy Cloud, key required. A comfy-api-proxy URL: self-hosted, key optional.
      COMFY_API_KEY: ${COMFY_API_KEY:-}
      COMFY_BASE_URL: ${COMFY_BASE_URL:-}
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - sqlite-data:/app/data
    init: true
volumes:
  sqlite-data:
