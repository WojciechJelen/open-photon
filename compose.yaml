services:
  app:
    build: .
    platform: linux/amd64
    # The optional settings in `.env` (see `.env.example`) reach the app too.
    env_file:
      - path: .env
        required: false
    environment:
      COMFY_API_KEY: ${COMFY_API_KEY:-}
      COMFY_BASE_URL: ${COMFY_BASE_URL:-https://cloud.comfy.org}
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - sqlite-data:/app/data
    init: true
  # Explicit target: docker compose --profile selfhost up --build selfhost
  # Stop app first: these services publish the same local port.
  selfhost:
    extends:
      service: app
    profiles: [selfhost]
    environment:
      COMFY_BASE_URL: ${COMFY_BASE_URL:-http://host.docker.internal:8189}
      # Empty for an SSH tunnel; otherwise the proxy's bearer token, never a Cloud key.
      COMFY_API_KEY: ${COMFY_API_KEY:-}
    volumes:
      - selfhost-data:/app/data
volumes:
  selfhost-data:
  sqlite-data:
