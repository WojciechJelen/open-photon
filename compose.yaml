# The project name, and with it the volume (`<project>_sqlite-data`), is `COMPOSE_PROJECT_NAME`
# (default: this directory's name), so each worktree gets its own; the host port is `PORT`.
services:
  app:
    image: ghcr.io/wojciechjelen/open-photon:0.3.0
    # The optional settings in `.env` (see `.env.example`) reach the app too.
    env_file:
      - path: .env
        required: false
    environment:
      # Cloud key OR proxy URL and token; never send a Cloud key to a proxy.
      COMFY_API_KEY: ${COMFY_API_KEY:-}
      COMFY_BASE_URL: ${COMFY_BASE_URL:-}
      COMFY_PROXY_TOKEN: ${COMFY_PROXY_TOKEN:-}
      # The container always listens on 3000; a `PORT` in `.env` picks the host port only.
      PORT: "3000"
    ports:
      - "127.0.0.1:${PORT:-3030}:3000"
    volumes:
      - sqlite-data:/app/data
    init: true
volumes:
  sqlite-data:
