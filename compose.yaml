services:
  app:
    build: .
    platform: linux/amd64
    environment:
      COMFY_API_KEY: ${COMFY_API_KEY:?Set COMFY_API_KEY in .env}
      COMFY_BASE_URL: https://cloud.comfy.org
    ports:
      - "127.0.0.1:3030:3000"
    volumes:
      - sqlite-data:/app/data
    init: true
volumes:
  sqlite-data:
