name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check:models
      - run: npm run check:open-weights
      - run: npm run check
      - run: npm run check:privacy
      - name: Install FFmpeg for the probe and trim tests
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: npm run test:server
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (own dev server, database and minted access code; Comfy at a dead port)
        run: npm run test:e2e
      - name: Build production image and scan client output
        run: docker build --platform linux/amd64 --tag open-photon:ci .
      - name: Check access and upload memory on native AMD64
        env:
          MEMORY_DOCKER_CONTEXT: default
          MEMORY_CONTAINER: open-photon-memory
          BASE_URL: http://127.0.0.1:3031
        run: |
          test "$(uname -m)" = x86_64
          docker run -d --name open-photon-memory --init --user 0 \
            --mount type=volume,destination=/app/data,volume-nocopy \
            -e ENABLE_DEBUG=1 -p 127.0.0.1:3031:3000 open-photon:ci
          # The first request opens (and migrates) the database; then mint a code on the volume.
          for attempt in $(seq 60); do curl -fsS -o /dev/null "$BASE_URL/healthz" && break; sleep 1; done
          ACCESS_CODE=$(docker exec --user node open-photon-memory node scripts/mint-code.mjs ci 5)
          echo "::add-mask::$ACCESS_CODE"
          export ACCESS_CODE
          node scripts/verify-access.mjs
          node scripts/verify-upload-memory.mjs
      - name: Verify volume permissions and unprivileged application process
        run: |
          docker exec open-photon-memory sh -ec '
            app_pid=$(cat /proc/1/task/1/children)
            test -n "$app_pid"
            for pid in $app_pid; do
              test "$(awk "/^Uid:/ {print \$2}" /proc/$pid/status)" = 1000
            done
            test "$(stat -c %u /app/data)" = 1000
            test "$(stat -c %u /app/data/assets)" = 1000
          '
          docker exec --user node open-photon-memory node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            const db = new DatabaseSync("/app/data/permission-check.sqlite");
            db.exec("CREATE TABLE permission_check (id INTEGER PRIMARY KEY); INSERT INTO permission_check VALUES (1)");
            db.close();
          '
      - name: Remove upload test container and its temporary volume
        if: always()
        run: docker rm --force --volumes open-photon-memory || true
