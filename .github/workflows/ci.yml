name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish app and GPU images after verification
        type: boolean
        default: false
      version:
        description: Image version (must match package.json)
        type: string
        default: "0.4.1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check:models
      - run: npm run check:open-weights
      - run: npm run check
      - run: npm run check:privacy
      - name: Verify GPU proxy links behind a gateway
        run: |
          python3 -m venv /tmp/proxy-test
          /tmp/proxy-test/bin/pip install comfy-api-proxy==0.1.6
          /tmp/proxy-test/bin/python -m unittest discover -s tests -p '*_test.py'
      - name: Install FFmpeg for the probe and trim tests
        timeout-minutes: 5
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install --yes --no-install-recommends ffmpeg
      - run: npm run test:server
      - name: Install Chromium for the browser tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (two own dev servers, databases and access codes; Comfy at a dead port, and the fake provider for *.fake.spec.ts)
        run: npm run test:e2e
      - name: Keep the failed browser tests' traces and page snapshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build production image and scan client output
        run: docker build --platform linux/amd64 --tag open-photon:ci .
      - name: Kill and restart the packaged app with generations waiting, preparing and finalizing
        run: node scripts/verify-packaged-restart.mjs
      - name: Check access and upload memory on native AMD64
        env:
          MEMORY_DOCKER_CONTEXT: default
          MEMORY_CONTAINER: open-photon-memory
          BASE_URL: http://127.0.0.1:3031
        run: |
          test "$(uname -m)" = x86_64
          docker run -d --name open-photon-memory --init --user 0 \
            --mount type=volume,destination=/app/data,volume-nocopy \
            -e ENABLE_DEBUG=1 -e COMFY_BASE_URL=http://127.0.0.1:1 -p 127.0.0.1:3031:3000 open-photon:ci
          # The first request opens (and migrates) the database; then mint a code on the volume.
          for attempt in $(seq 60); do curl -fsS -o /dev/null "$BASE_URL/healthz" && break; sleep 1; done
          ACCESS_CODE=$(docker exec --user node open-photon-memory node scripts/mint-code.mjs ci 5)
          echo "::add-mask::$ACCESS_CODE"
          export ACCESS_CODE
          node scripts/verify-access.mjs
          node scripts/verify-upload-memory.mjs
      - name: Verify volume permissions and unprivileged application process
        run: |
          docker exec open-photon-memory sh -ec '
            app_pid=$(cat /proc/1/task/1/children)
            test -n "$app_pid"
            for pid in $app_pid; do
              test "$(awk "/^Uid:/ {print \$2}" /proc/$pid/status)" = 1000
            done
            test "$(stat -c %u /app/data)" = 1000
            test "$(stat -c %u /app/data/assets)" = 1000
          '
          docker exec --user node open-photon-memory node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            const db = new DatabaseSync("/app/data/permission-check.sqlite");
            db.exec("CREATE TABLE permission_check (id INTEGER PRIMARY KEY); INSERT INTO permission_check VALUES (1)");
            db.close();
          '
      - name: Remove upload test container and its temporary volume
        if: always()
        run: docker rm --force --volumes open-photon-memory || true

  images:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: open-photon
            dockerfile: Dockerfile
            arch: amd64
            runner: ubuntu-24.04
          - image: open-photon
            dockerfile: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: open-photon-comfy
            dockerfile: selfhost/Dockerfile
            arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build and publish architecture image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          ARCH: ${{ matrix.arch }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          image="ghcr.io/${OWNER,,}/$IMAGE:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          docker build --platform "linux/$ARCH" --file "$DOCKERFILE" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$image" .
          docker push "$image"

  publish:
    needs: [verify, images]
    runs-on: ubuntu-24.04
    concurrency:
      group: ghcr-release-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Refuse to overwrite an existing release
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const version = process.env.VERSION;
          assert.equal(version, JSON.parse(readFileSync("package.json")).version);
          assert.match(version, /^\d+\.\d+\.\d+$/, "Publish a stable release version");
          for (const image of ["open-photon", "open-photon-comfy"]) {
            const repository = `${process.env.OWNER.toLowerCase()}/${image}`;
            const query = new URLSearchParams({ service: "ghcr.io", scope: `repository:${repository}:pull` });
            const auth = await fetch(`https://ghcr.io/token?${query}`);
            assert.ok(auth.ok, `Cannot check registry access: HTTP ${auth.status}`);
            const { token } = await auth.json();
            const response = await fetch(`https://ghcr.io/v2/${repository}/manifests/${encodeURIComponent(version)}`, {
              headers: {
                Authorization: `Bearer ${token}`,
                Accept: "application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json",
              },
            });
            assert.equal(response.status, 404,
              `${repository}:${version} is already published or could not be checked. Use a new package version; existing releases are immutable.`);
          }
          JS
      - name: Publish matching version tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          test "$VERSION" = "$(node -p 'require("./package.json").version')"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repository="ghcr.io/${OWNER,,}/open-photon"
          build="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker buildx imagetools create --tag "$repository:$VERSION" \
            "$repository:$build-amd64" "$repository:$build-arm64"
          docker buildx imagetools create --tag "$repository-comfy:$VERSION" \
            "$repository-comfy:$build-amd64"
      - name: Verify public images and publish their manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/verify-image-pair.mjs "$VERSION" "$GITHUB_SHA" "$OWNER" > image-pair.json
          gh release create "v$VERSION" image-pair.json --target "$GITHUB_SHA" \
            --title "Open Photon $VERSION" \
            --notes "Includes the agent setup copy button and public guide: https://github.com/$GITHUB_REPOSITORY/blob/v$VERSION/SETUP.md. Compatible app (Linux AMD64/ARM64) and GPU (Linux AMD64) images. The attached image-pair.json records anonymous registry verification, immutable digests and the exact source commit."
