name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SPIKE_DOCKER_CONTEXT: default
      SPIKE_IMAGE: open-photon:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run check:privacy
      - run: npm run test:server
      - run: npx playwright install --with-deps chromium
      - name: Build production image and scan client output
        run: docker build --platform linux/amd64 --tag "$SPIKE_IMAGE" .
      - run: npm run test:container
      - name: Verify packaged SDK against local mock
        run: node scripts/verify-sdk.mjs
