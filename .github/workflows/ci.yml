name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check
      - run: npm run check:privacy
      - run: npm run test:server
      - name: Build production image and scan client output
        run: docker build --platform linux/amd64 --tag open-photon:ci .
      - name: Check upload memory on native AMD64
        env:
          SPIKE_DOCKER_CONTEXT: default
          SPIKE_CONTAINER: open-photon-memory
          BASE_URL: http://127.0.0.1:3031
          APP_ACCESS_CODE: ci-only-access-code-not-a-secret
        run: |
          test "$(uname -m)" = x86_64
          docker run -d --name open-photon-memory --init --user 0 \
            --mount type=volume,destination=/app/data,volume-nocopy \
            -e ENABLE_SPIKE_CHECKS=1 -e APP_ACCESS_CODE -p 127.0.0.1:3031:3000 open-photon:ci
          node scripts/verify-access.mjs
          node scripts/verify-upload-memory.mjs
      - name: Verify volume permissions and unprivileged application process
        run: |
          docker exec open-photon-memory sh -ec '
            app_pid=$(cat /proc/1/task/1/children)
            test -n "$app_pid"
            for pid in $app_pid; do
              test "$(awk "/^Uid:/ {print \$2}" /proc/$pid/status)" = 1000
            done
            test "$(stat -c %u /app/data)" = 1000
            test "$(stat -c %u /app/data/media)" = 1000
          '
          docker exec --user node open-photon-memory node --input-type=module -e '
            import { DatabaseSync } from "node:sqlite";
            const db = new DatabaseSync("/app/data/permission-check.sqlite");
            db.exec("CREATE TABLE permission_check (id INTEGER PRIMARY KEY); INSERT INTO permission_check VALUES (1)");
            db.close();
          '
      - name: Remove upload test container and its temporary volume
        if: always()
        run: docker rm --force --volumes open-photon-memory || true
